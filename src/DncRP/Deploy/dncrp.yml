apiVersion: apps/v1
kind: Deployment
metadata:
  name: dncrp-deployment
  labels:
    app: dncrp
spec:
  selector:
    matchLabels:
      app: dncrp
  replicas: 3
  template:
    metadata:
      labels:
        app: dncrp
    spec:
      containers:
      - name: dncrp-container
        image: acndev.azurecr.io/dncrp:latest
        imagePullPolicy: Always
        env:
        - name: AzureServicesAuthConnectionString 
          value: "RunAs=App;AppId=262f78a7-6c32-4e3b-ae07-39840003dfc8"
        ports:
        - containerPort: 5002
          name: dncrpport
      imagePullSecrets:
        - name: acndev.azurecr.io-key