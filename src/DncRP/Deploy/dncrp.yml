apiVersion: apps/v1
kind: Deployment
metadata:
  name: dncrp-deployment
  labels:
    app: dncrp
spec:
  selector:
    matchLabels:
      app: dncrp
  replicas: 3
  template:
    metadata:
      labels:
        app: dncrp
    spec:
      containers:
      - name: dncrp-container
        image: acndev.azurecr.io/dncrp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
          name: dncrpport
        envFrom:
        - secretRef:
            name: acn-kv-secret

      imagePullSecrets:
        - name: acndev.azurecr.io-key