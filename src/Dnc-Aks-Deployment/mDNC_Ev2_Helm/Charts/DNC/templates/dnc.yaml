apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnc-deployment
  labels:
    app: dnc
spec:
  selector:
    matchLabels:
      app: dnc
  minReadySeconds: 300     
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  replicas: {{ .Values.replicacount }}            
  template:
    metadata:
      annotations:
        timestamp: "{{ date "20060102150405" .Release.Time }}"    
      labels:
        app: dnc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dnc
            topologyKey: kubernetes.io/hostname
      containers:
      - name: dnc-container
        image: {{ .Values.containerregistry }}/{{ .Values.dncbuildtag }}
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        - name: dnc-config
          mountPath: /etc/dnc
        args:
        - -stderr=true           
        ports:
        - containerPort: 9000
          name: dncport
        env:
        - name : DNC_CONFIGURATION_PATH
          value : /etc/dnc/dnc_config.json
        livenessProbe:
          httpGet:
            path: /healthz
            port: dncport
            scheme: HTTP
          failureThreshold: 3
          periodSeconds: 60
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: dncport
            scheme: HTTP
          failureThreshold: 1
          timeoutSeconds: 5
          initialDelaySeconds: 30                             
      - name: gateway-container
        image: {{ .Values.containerregistry }}/{{ .Values.gatewaybuildtag }}
        volumeMounts:
        - name: log
          mountPath: /var/log
        - name: gateway-config
          mountPath: /etc/gateway     
        ports:
        - containerPort: 5001
          name: gatewayport
        env:
        - name : GATEWAY_CONFIG_PATH
          value : /etc/gateway
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        livenessProbe:
          httpGet:
            path: /health
            port: gatewayport
            scheme: HTTPS
          failureThreshold: 3
          periodSeconds: 60
        startupProbe:
          httpGet:
            path: /health
            port: gatewayport
            scheme: HTTPS
          failureThreshold: 1
          timeoutSeconds: 5
          initialDelaySeconds: 10                      
      - name: dnc-rc
        image: {{ .Values.containerregistry }}/{{ .Values.dncrcbuildtag }}
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        - name: dncrc-config
          mountPath: /etc/dnc-rc        
        args:
        - -c=/etc/dnc-rc/dncrc_config.json
        env:
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/requestcontroller
            - ping-dnc
            - -c=/etc/dnc-rc/dncrc_config.json
          initialDelaySeconds: 15
          periodSeconds: 60
          failureThreshold: 3
      volumes:
      - name: log
        hostPath:
          path: /var/log
          type: Directory
      - name: dnc-config
        configMap:
          name: dnc-config
      - name: dncrc-config
        configMap:
          name: dncrc-config
      - name: gateway-config
        configMap:
          name: gateway-config
---          
kind: Service
apiVersion: v1
metadata:
  name: gateway-service
spec:
  selector:
    app: dnc
  type: LoadBalancer
  ports:
  - name: gatewayport
    port: 443
    targetPort: 5001
    protocol: TCP               