apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnc-deployment
  labels:
    app: dnc
spec:
  selector:
    matchLabels:
      app: dnc
  replicas: 3
  template:
    metadata:
      labels:
        app: dnc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dnc
            topologyKey: kubernetes.io/hostname
      hostNetwork: true
      containers:
      - name: dnc-container
        image: msint.azurecr.io/containernetworking/dnc:test
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        ports:
        - containerPort: 9000
        env:
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      - name: gateway-container
        image: acndev.azurecr.io/dnc-gateway:latest
        ports:
        - containerPort: 5001
          name: gatewayport
        envFrom:
        - secretRef:
            name: gateway-kv-secret
        env:
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

      imagePullSecrets:
        - name: msint.azurecr.io-key
        - name: acndev.azurecr.io-key
      volumes:
      - name: log
        hostPath:
          path: /var/log
          type: Directory