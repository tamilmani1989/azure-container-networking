[Service]
; To be safe making it disabled everywhere except where we want it enabled
Disabled=false
RunAsAccount=System
RequiredDataFolders=HostNetAgentDataDeployment

[AutopilotTests]
TestConfigurationFiles=WatchdogHeartbeatTest.xml

[DataSyncRules]
AzureClusterType:Prod$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
ClusterAlias:PublicPilotFish,AzureClusterType:Test$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-Test,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT