ClusterAlias:BlackForest$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-BlackForest,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
ClusterAlias:FairFax$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-Fairfax,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
ClusterAlias:MoonCake$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-MoonCake,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
ClusterAlias:USSec$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-USSec,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
ClusterAlias:USNat$Data\HostNetAgentDataDeployment=HostNetAgentDataDeployment-USNat,300,DefaultSignatureID=CertSigned:Root,Flatten=HostNetAgentDCMT
