kind: ServiceAccount
apiVersion: v1
metadata:
  name: runner-sa
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: default
  name: runner-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "nodes", "services", "deployments", "containers", "pods/exec", "pods/log"]
  verbs: ["get", "create", "delete", "update", "list"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: default
  name: runner-role-binding
subjects:
- kind: ServiceAccount
  name: runner-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: runner-role
  apiGroup: rbac.authorization.k8s.io
---
kind: Service
apiVersion: v1
metadata:
  name: runner-service
spec:
  selector:
    app: swift-runner
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 9009
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: swift-runner-pod
  labels:
    app: swift-runner 
spec:
  selector:
    matchLabels:
      app: swift-runner
  template:
    metadata:
      labels:
        app: swift-runner
    spec:
      hostNetwork: true
      serviceAccountName: runner-sa
      containers:
      - name: swift-runner
        image: mcr.microsoft.com/containernetworking/swift-runner:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 9009
        env:
        - name: CUST_VNET
          value: "6a16ebf4-2ef6-472a-a774-03caa2ea5c7b"
        - name: SERVICE_TUNNEL_EP
          value: "https://eastus2euapst0.blob.core.windows.net/swift/testblob.txt"
        - name: PRIVATELINK_EP
          value: "https://eastus2euapplst0.blob.core.windows.net/swiftpl/testblob.txt"
        - name: PARTITION_KEY
          value: "eastus2euap-sr-partition"
        - name: BLOB
          value: "eastus2euap-sr-blob"
        - name: CONTAINER
          value: "eastus2euap-sr-container"
        - name: STORAGE_KEY
          value: "REPLACE_WITH_STORAGE_KEY"
        - name: NODE1
          value: "k8s-agentpool1-14938606-0"
        - name: NODE2
          value: "k8s-agentpool1-14938606-1"
        - name: AUTHENTICATION_TOKEN
          value: "REPLACE_WITH_AUTHENTICATION_TOKEN"
        - name: CUST_VNET_WITH_MNAT
          value: "REPLACE_WITH_CUST_VNET_WITH_MNAT_VNETID"
        - name: AUTHENTICATION_TOKEN_CUST_VNET_WITH_MNAT
          value: "REPLACE_WITH_AUTHENTICATION_TOKEN_CUST_VNET_WITH_MNAT"
        - name: MNAT_PUBLIC_IP
          value: "REPLACE_WITH_MNAT_PUBLIC_IP"
