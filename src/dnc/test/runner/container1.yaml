apiVersion: apps/v1
kind: Deployment
metadata:
  name: container1
  namespace: default
spec:
  selector:
    matchLabels:
      app: container1
  replicas: 1
  template:
    metadata:
      labels:
        app: container1
    spec:
      imagePullSecrets:
        - name: acndev.azurecr.io-key
      containers:
      - name: container1
        image: acndev.azurecr.io/swift-nc:latest
        ports:
        - containerPort: 80
      nodeSelector:
        forPod: one
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 168.63.129.16
