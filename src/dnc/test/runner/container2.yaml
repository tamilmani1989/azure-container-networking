apiVersion: apps/v1
kind: Deployment
metadata:
  name: container2
  namespace: default
spec:
  selector:
    matchLabels:
      app: container2
  replicas: 1
  template:
    metadata:
      labels:
        app: container2
    spec:
      containers:
      - name: container2
        image: mcr.microsoft.com/containernetworking/swift-nc:latest
        ports:
        - containerPort: 80
      nodeSelector:
        forPod: two
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 168.63.129.16
