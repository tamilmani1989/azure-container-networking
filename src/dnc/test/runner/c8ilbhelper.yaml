apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8ilbhelper
  namespace: default
spec:
  selector:
    matchLabels:
      app: c8ilbhelper
  replicas: 1
  template:
    metadata:
      labels:
        app: c8ilbhelper
    spec:
      imagePullSecrets:
        - name: acndev.azurecr.io-key
      containers:
        - name: c8ilbhelper
          image: acndev.azurecr.io/swift-lbrunnernc:latest
          ports:
            - containerPort: 9095
      nodeSelector:
        forPod: one
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 168.63.129.16
