kind: Service
apiVersion: v1
metadata:
  name: cns-service
spec:
  selector:
    app: cns
  ports:
    - name: cns-port
      port: 10090
      targetPort: 10090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cns-pod
  labels:
    app: cns
spec:
  selector:
    matchLabels:
      app: cns
  replicas: 2
  template:
    metadata:
      labels:
        app: cns
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cns
            topologyKey: kubernetes.io/hostname
      hostNetwork: true
      containers:
      - name: cns-container
        image: mcr.microsoft.com/containernetworking/azure-cns:latest
        args: [ "-c", "tcp://$(CNSIpAddress):$(CNSPort)", "-t", "$(CNSLogTarget)"]
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        - name: cni
          mountPath: /opt/cni/bin
        - name: cniconfig
          mountPath: /etc/cni/net.d
        - name: cns-state
          mountPath: /var/lib/azure-network
        - name: cns-config
          mountPath: /etc/azure-cns
        ports:
        - containerPort: 10090
        env:
        - name: CNSIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CNSPort
          value: "10090"
        - name: CNSLogTarget
          value: "stdoutfile"
        - name: CNS_CONFIGURATION_PATH
          value: /etc/azure-cns/cns_config.json
      volumes:
      - name: log
        hostPath:
          path: /var/log
          type: Directory
      - name: cni
        hostPath:
          path: /opt/cni/bin
          type: Directory
      - name: cniconfig
        hostPath:
          path: /etc/cni/net.d
          type: Directory
      - name: cns-state
        hostPath:
          path: /var/lib/azure-network
          type: DirectoryOrCreate
      - name: cns-config
        configMap:
          name: cns-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cns-config
data:
  cns_config.json: |
    {
      "TelemetrySettings": {
          "TelemetryBatchSizeBytes": 16384,
          "TelemetryBatchIntervalInSecs": 15,
          "RefreshIntervalInSecs": 15,
          "DisableAll": false,
          "HeartBeatIntervalInMins": 30,
          "DebugMode": false,
          "SnapshotIntervalInMins": 60
      },
      "ManagedSettings": {
          "PrivateEndpoint": "",
          "InfrastructureNetworkID": "",
          "NodeID": "",
          "NodeSyncIntervalInSeconds": 30
      },
      "ChannelMode": "Direct"
    }