apiVersion: apps/v1
kind: Deployment
metadata:
  name: container4lb
  namespace: default
spec:
  selector:
    matchLabels:
      app: container4lb
  replicas: 1
  template:
    metadata:
      labels:
        app: container4lb
    spec:
      containers:
      - name: container4lb
        image: mcr.microsoft.com/containernetworking/swift-lbrunnernc:latest
        ports:
        - containerPort: 9095
      nodeSelector:
        forPod: two
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 168.63.129.16
