apiVersion: apps/v1
kind: Deployment
metadata:
  name: container6lbmnat
  namespace: default
spec:
  selector:
    matchLabels:
      app: container6lbmnat
  replicas: 1
  template:
    metadata:
      labels:
        app: container6lbmnat
    spec:
      imagePullSecrets:
        - name: acndev.azurecr.io-key
      containers:
      - name: container6lbmnat
        image: acndev.azurecr.io/swift-lbrunnernc:latest
        ports:
        - containerPort: 9095
      nodeSelector:
        forPod: two
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 168.63.129.16
