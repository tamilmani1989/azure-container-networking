kind: Service
apiVersion: v1
metadata:
  name: dnc-service
spec:
  selector:
    app: dnc
  ports:
    - name: dnc-port
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnc-pod
  labels:
    app: dnc
spec:
  selector:
    matchLabels:
      app: dnc
  replicas: 2
  template:
    metadata:
      labels:
        app: dnc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dnc
            topologyKey: kubernetes.io/hostname
      hostNetwork: true
      containers:
      - name: dnc-container
        image: msint.azurecr.io/containernetworking/dnc:latest
        args: ["-stderr"]
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        - name: dnc-config
          mountPath: /etc/dnc
        - name: telemetry
          mountPath: /var/run/azure-vnet-telemetry.sock
        ports:
        - containerPort: 9000
        env:
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DNC_CONFIGURATION_PATH
          value: /etc/dnc/config.json
        - name: DataStoreStorageKey
          valueFrom:
            secretKeyRef:
              name: storage-key
              key: value
        - name: MasterElectionStorageKey
          valueFrom:
            secretKeyRef:
              name: storage-key
              key: value
      imagePullSecrets:
        - name: msint.azurecr.io-key
      volumes:
      - name: log
        hostPath:
          path: /var/log
          type: Directory
      - name: dnc-config
        configMap:
          name: dnc-config
      - name: telemetry
        hostPath:
          path: /var/run/azure-vnet-telemetry.sock
          type: Socket
