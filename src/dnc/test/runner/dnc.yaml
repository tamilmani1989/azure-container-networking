kind: Service
apiVersion: v1
metadata:
  name: dnc-service
spec:
  selector:
    app: dnc
  ports:
    - name: dnc-port
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnc-pod
  labels:
    app: dnc
spec:
  selector:
    matchLabels:
      app: dnc
  replicas: 2
  template:
    metadata:
      labels:
        app: dnc
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - dnc
            topologyKey: kubernetes.io/hostname
      hostNetwork: true
      containers:
      - name: dnc-container
        image: msint.azurecr.io/containernetworking/dnc:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: log
          mountPath: /var/log
        ports:
        - containerPort: 9000
        env:
        - name: DNCIpAddress
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      imagePullSecrets:
        - name: msint.azurecr.io-key
      volumes:
      - name: log
        hostPath:
          path: /var/log
          type: Directory
