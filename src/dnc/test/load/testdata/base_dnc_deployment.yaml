apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnc
  labels:
    app: dnc
spec:
  selector:
    matchLabels:
      app: dnc
  replicas: 1
  template:
    metadata:
      labels:
        app: dnc
    spec:
      volumes:
        - name: log
          hostPath:
            path: /var/log
            type: Directory
        - name: dnc-config
          configMap:
            name: dnc-config
