apiVersion: v1
kind: Service
metadata:
  labels:
    app: dnc
  name: dnc-service
  namespace: dnc
spec:
  selector:
    app: dnc
  type: ClusterIP
  ports:
  - name: http
    port: 9000
    protocol: TCP
    targetPort: 9000