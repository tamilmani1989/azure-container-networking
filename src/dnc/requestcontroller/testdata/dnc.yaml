apiVersion: apps/v1
kind: Deployment
metadata:
  name: "dnc"
  namespace: "dnc"
  labels:
    app: "dnc"
spec:
  selector:
    matchLabels:
      app: "dnc"
  replicas: 1
  template:
    metadata:
      labels:
        app: "dnc"
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: Exists
      containers:
      - name: dnc
        image: acndev.azurecr.io/dnc:20210301-matlong
        ports:
        - containerPort: 9000
        env:
        - name: DNC_CONFIGURATION_PATH
          value: /etc/dnc/config.json
        volumeMounts:
        - name: dnc-config
          mountPath: /etc/dnc/
        args:
        - -stderr=true
      volumes:
      - name: dnc-config
        configMap:
          name: dnc-config
---
