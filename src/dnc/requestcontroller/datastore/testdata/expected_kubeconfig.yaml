apiVersion: v1
clusters:
- cluster:
    insecure-skip-tls-verify: true
    server: https://127.0.0.1:51643
  name: swift-cluster
contexts:
- context:
    cluster: swift-cluster
    user: requestcontroller
  name: swift-context
current-context: swift-context
kind: Config
preferences: {}
users:
- name: requestcontroller
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 8168b62c-179e-4415-8a06-7fa8d65a3317
      - --client-id
      - 1efe5bbf-d5b1-4fe9-99fa-f55ce1c88679
      - --client-certificate
      - /tmp/client-cert.pfx
      - --tenant-id
      - 587619d9-24e8-4a4a-bba6-6d4d8e1227a0
      - -v
      - "7"
      - --login
      - spn
      command: /usr/local/bin/kubelogin