apiVersion: v1
clusters:
- cluster:
    insecure-skip-tls-verify: true
    server: https://kubernetes
  name: swift-cluster
contexts:
- context:
    cluster: swift-cluster
    user: requestcontroller
  name: swift-context
current-context: swift-context
kind: Config
preferences: {}
users:
- name: requestcontroller
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - orchestrator-app-id
      - --client-id
      - client-id
      - --client-certificate
      - testdata/output/client-id.pfx
      - --tenant-id
      - d4aabfe3-34f6-4c52-b7f2-922d78f6e18f
      - -v
      - "7"
      - --login
      - spn
      command: /usr/local/bin/kubelogin