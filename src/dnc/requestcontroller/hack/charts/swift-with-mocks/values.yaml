# Default values for swift-with-mocks.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

dnc:
  image:
    repository: "dnc"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000
    name: dnc-service
cnsmock:
  image:
    repository: "cnsmock"
    tag: "latest"
    pullPolicy: "IfNotPresent"
nmagentmock:
  image:
    repository: "nmagentmock"
    tag: "latest"
    pullPolicy: "IfNotPresent"
dnctl:
  image:
    repository: "dnctl"
    tag: "latest"
    pullPolicy: "IfNotPresent"