pr:
  branches:
    include:
      - master

trigger:
  branches:
    include:
      - master

variables:
- name: dnc-underlay-config-path
  value: ~/.kube/dnc-underlay
- name: stable-acn-config-path
  value: ~/.kube/stable-acn-cx-cluster
- name: dnc-deployment-name
  value: delegated-network-controller
- name: dnc-label-selector
  value: app=dnc
- name: cns-label-selector
  value: k8s-app=azure-cns

stages:
  - stage: aks_swift_build_and_test
    jobs:
      - job: aks_swift_build_test
        pool:
          name: Networking-ContainerNetworking
          demands: 
          - agent.os -equals Linux
          - Role -equals $(CUSTOM_E2E_ROLE)

        container:
          image: "$(BUILD_IMAGE)"
          options: "--privileged"

        # Go setup for the vmImage:
        # https://github.com/Microsoft/azure-pipelines-image-generation/blob/master/images/linux/scripts/installers/go.sh
        variables:
          GOPATH: "$(System.DefaultWorkingDirectory)/gopath" # Go workspace path
          GOBIN: "$(GOPATH)/bin" # Go binaries path
          modulePath: "$(GOPATH)/src/dnc" # $(build.repository.name)' # Path to the module's code

        steps:
          - bash: |
              set -e
              echo $UID
              sudo rm -rf $(System.DefaultWorkingDirectory)/*
              sudo rm /run/docker/plugins/test.sock || true
              sudo ip link del dev dummy || true
            displayName: "Set up OS environment"
            condition: succeeded()

          - checkout: self

          - bash: |
              set -e
              go version
              go env
              mkdir -p '$(GOBIN)'
              mkdir -p '$(GOPATH)/pkg'
              mkdir -p '$(modulePath)'
              shopt -s extglob
              shopt -s dotglob
              cp -a ./src/dnc/* '$(modulePath)/'
              echo '##vso[task.prependpath]$(GOBIN)'
              echo '##vso[task.prependpath]$(GOROOT)/bin'
            name: "Env"
            displayName: "Set up the Go environment"
            condition: succeeded()

          - script: |
              set -e
              IMAGE_TAG=$(git describe --tags --always --dirty)-test
              echo "##vso[task.setvariable variable=ImageTag;isOutput=true]$IMAGE_TAG"
              echo "##vso[task.setvariable variable=DncImage;isOutput=true]$IMAGE_REGISTRY/dnc-pr:$IMAGE_TAG"
              echo "##vso[task.setvariable variable=DncRcImage;isOutput=true]$IMAGE_REGISTRY/dnc-request-controller-pr:$IMAGE_TAG"
            workingDirectory: "$(modulePath)"
            name: "EnvironmentalVariables"
            displayName: "Set environmental variables"
            condition: succeeded()

          - script: |
              set -e
              make dnc-image VERSION=$(EnvironmentalVariables.ImageTag) DNC_IMAGE=$(IMAGE_REGISTRY)/dnc-pr
            workingDirectory: "$(modulePath)"
            name: "BuildDNC"
            displayName: "Build DNC Image"
            condition: succeeded()

          - script: |
              set -e
              make requestcontroller-image VERSION=$(EnvironmentalVariables.ImageTag) REQCTRL_IMAGE=$(IMAGE_REGISTRY)/dnc-request-controller-pr
            workingDirectory: "$(modulePath)"
            name: "BuildDNCRC"
            displayName: "Build DNC-RC Image"
            condition: succeeded()

          - script: |
              echo '$(DOCKER_PASSWORD)' | docker login $IMAGE_REGISTRY -u '$(DOCKER_USERNAME)' --password-stdin
              docker push $(EnvironmentalVariables.DncImage)
              docker push $(EnvironmentalVariables.DncRcImage)

              function auto-retry()
              {
                  export i="1"
                  export attempts="300"
                  false
                  while [[ $? -ne 0 ]] && [[ $i -lt $attempts ]]; do
                    printf "Attempt $i/$attempts - " && "$@" && break ||  sleep 3 &&  i=$[$i+1] && false
                  done
              }

              auto-retry docker pull $(EnvironmentalVariables.DncImage)
              auto-retry docker pull $(EnvironmentalVariables.DncRcImage)
            workingDirectory: "$(modulePath)"
            name: "dockerpush"
            displayName: "Push images"
            condition: succeeded()

          - task: AzureCLI@1
            inputs:
              azureSubscription: $(ARTIFACT_SUBSCRIPTION)
              scriptLocation: "inlineScript"
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                mkdir -p ~/.kube/
                echo "Dirty DNC Underlay config"
                az keyvault secret show --name $(KV_DNC_UNDERLAY_SECRET_NAME) --vault-name $(KV_NAME) --query value | sed 's/\\n/\n/g' | sed -e 's/^"//' -e 's/"$//'
                az keyvault secret show --name $(KV_DNC_UNDERLAY_SECRET_NAME) --vault-name $(KV_NAME) --query value | sed 's/\\n/\n/g' | sed -e 's/^"//' -e 's/"$//' > $(dnc-underlay-config-path)
                echo "Stable ACN config"
                az keyvault secret show --name $(KV_STABLE_ACN_SECRET_NAME) --vault-name $(KV_NAME) --query value | sed 's/\\n/\n/g' | sed -e 's/^"//' -e 's/"$//'
                az keyvault secret show --name $(KV_STABLE_ACN_SECRET_NAME) --vault-name $(KV_NAME) --query value | sed 's/\\n/\n/g' | sed -e 's/^"//' -e 's/"$//' > $(stable-acn-config-path)
                
            displayName: Pull Kubeconfig from Keyvault
            condition: succeeded()
          
          - script: |
              set -e
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
              export KUBECONFIG=$(dnc-underlay-config-path)
              kubectl cluster-info
              kubectl get po -n $DIRTY_DNC_NAMESPACE -owide
              kubectl get po -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) -oyaml | grep -B 4 -A 4 -m 2 image:
              kubectl get deployment -n $DIRTY_DNC_NAMESPACE $(dnc-deployment-name) -o json > deployment.json
              
              echo "modifying deployment with dirty image versions"
              cat deployment.json | jq --arg dncimage $(EnvironmentalVariables.DncImage) '.spec.template.spec.containers[0].image=$dncimage' > deployment-temp.json
              cat deployment-temp.json | jq --arg dncrcimage $(EnvironmentalVariables.DncRcImage) '.spec.template.spec.containers[1].image=$dncrcimage' > deployment.json
              echo "modified dnc dncrc deployment images"
              cat deployment.json | grep -B 4 -A 4 -m 2 image\"
              echo "about to replace"
              kubectl replace -f deployment.json > output.txt
              cat output.txt
              echo "after replace"
              sleep 30

              echo "Waiting for pod to be ready..."
              export i="1"
              export attempts="100"
              while [[ $(kubectl get pods -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) -o 'jsonpath={..status.conditions[?(@.type=="Ready")].status}') != "True" ]]; do
                sleep 3;
                i=$[$i+1]
                if [[ $i -gt $attempts ]]
                then
                  echo "Pod never showed up, exiting"
                  exit 1
                fi
              done

              echo "Pod is up and running"
              kubectl get po -n $DIRTY_DNC_NAMESPACE -owide
              kubectl get po -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) -oyaml | grep -B 4 -A 4 -m 2 image:

            workingDirectory: "$(modulePath)"
            name: "replacedncdncrc"
            displayName: "Replace DNC & DNC-RC for dirty versions"
            condition: succeeded()

          - script: |
              echo "Refresh azure-cns pods"
              export KUBECONFIG=$(stable-acn-config-path)

              kubectl delete po -n kube-system -l $(cns-label-selector)

              echo "Waiting for CNS dameonset to be ready..."

              NUM_NODES=`kubectl get no | wc -l`
              NUM_NODES=$[$NUM_NODES-1]

              export i="1"
              export attempts="100"
              while [[ $(kubectl get ds -n kube-system azure-cns -ojson | jq '.status.numberReady') != $NUM_NODES ]]; do
                sleep 3;
                i=$[$i+1]
                if [[ $i -gt $attempts ]]
                then
                  echo "CNS daemonset never got ready, exiting"
                  exit 1
                fi
              done

              echo "Daemonset is ready"
              kubectl get ds -n kube-system azure-cns
              kubectl get po -n kube-system -l $(cns-label-selector) -oyaml | grep -m 2 -B 4 -A 4 image:

            workingDirectory: "$(modulePath)"
            name: "deletecns"
            displayName: "Refresh CNS pods"
            condition: succeeded()

          - script: |
              set -e
              echo "Versions about to run"
              export KUBECONFIG=$(dnc-underlay-config-path)
              kubectl get po -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) -oyaml | grep -B 4 -A 4 -m 2 image:
              
              cp $(stable-acn-config-path) ~/.kube/config
              export KUBECONFIG=~/.kube/config
              kubectl get po -n kube-system -l $(cns-label-selector) -oyaml | grep -m 2 -B 4 -A 4 image:

              # Vendoring doesn't include tests so we have to git clone the ACN github
              git clone https://github.com/Azure/azure-container-networking.git
              cd azure-container-networking/
              
              kubectl cluster-info
              kubectl get po -owide -A
              sudo -E env "PATH=$PATH" VERSION=$(EnvironmentalVariables.ImageTag) INSTALL_CNI=false INSTALL_CNS=false make test-integration

            workingDirectory: "$(modulePath)"
            name: "goldpinger"
            displayName: "ACN goldpinger tests"
            condition: succeeded()

          - script: |
              echo "Logs will be available as a build artifact"
              cd ./output 
              export KUBECONFIG=$(dnc-underlay-config-path)
              kubectl logs -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) --tail -1 -c dnc --prefix > dnc-logs.txt
              kubectl logs -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) --tail -1 -c requestcontroller --prefix > dnc-rc-logs.txt

              export KUBECONFIG=$(stable-acn-config-path)
              kubectl logs -n kube-system -l $(cns-label-selector) --tail -1 --prefix > cns-logs.txt

            workingDirectory: "$(modulePath)"
            name: "GetLogs"
            displayName: "Get logs"
            condition: always()

          - task: CopyFiles@2
            inputs:
              sourceFolder: "$(modulePath)/output"
              targetFolder: $(Build.ArtifactStagingDirectory)
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              artifactName: "output"
              pathtoPublish: "$(Build.ArtifactStagingDirectory)"
            condition: always()

          - script: |
              set -e
              docker rmi -f $(EnvironmentalVariables.DncImage)
              docker rmi -f $(EnvironmentalVariables.DncRcImage)
              export KUBECONFIG=$(dnc-underlay-config-path)
              echo "Restoring DNC and DNC RC to stable images (via pipeline variables)"
              kubectl get deployment -n $DIRTY_DNC_NAMESPACE $(dnc-deployment-name) -o json > deployment.json
              cat deployment.json | jq --arg dncimage $STABLE_DNC_IMAGE_FULL '.spec.template.spec.containers[0].image=$dncimage' > deployment-temp.json
              cat deployment-temp.json | jq --arg dncrcimage $STABLE_DNC_RC_IMAGE_FULL '.spec.template.spec.containers[1].image=$dncrcimage' > deployment.json
              echo "Stable deployment.json"
              cat deployment.json | grep -B 4 -A 4 -m 2 image\"
              kubectl replace -f deployment.json

              sleep 10
              kubectl get po -n $DIRTY_DNC_NAMESPACE -owide
              kubectl get po -n $DIRTY_DNC_NAMESPACE -l $(dnc-label-selector) -oyaml | grep -m 2 -A 4 -B 4 image:
          
            workingDirectory: "$(modulePath)"
            name: "restore"
            displayName: "Restore to stable DNC"
            condition: always()

  
        