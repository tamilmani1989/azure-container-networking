pr: none
trigger: none

stages:
  - stage: init
    jobs:
      - job: pipeline_variables
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - bash: |
                set -ex
                customer_cluster_1_rg=$(bash src/DncRP/testdata/scripts/init.sh generate-rg-name --customer-cluster-1 --git-commit-short "$(git rev-parse --short HEAD)")
                customer_cluster_2_rg=$(bash src/DncRP/testdata/scripts/init.sh generate-rg-name --customer-cluster-2 --git-commit-short "$(git rev-parse --short HEAD)")
                rp_resources_1_rg=$(bash src/DncRP/testdata/scripts/init.sh generate-rg-name --rp-resources-1 --git-commit-short "$(git rev-parse --short HEAD)")
                rp_resources_2_rg=$(bash src/DncRP/testdata/scripts/init.sh generate-rg-name --rp-resources-2 --git-commit-short "$(git rev-parse --short HEAD)")
                image_tag=$(bash src/DncRP/testdata/scripts/init.sh generate-image-tag --git-commit-short "$(git rev-parse --short HEAD)")
                echo "##vso[task.setvariable variable=customerCluster1RG;isOutput=true]$customer_cluster_1_rg"
                echo "##vso[task.setvariable variable=customerCluster2RG;isOutput=true]$customer_cluster_2_rg"
                echo "##vso[task.setvariable variable=rpResources1RG;isOutput=true]$rp_resources_1_rg"
                echo "##vso[task.setvariable variable=rpResources2RG;isOutput=true]$rp_resources_2_rg"
                echo "##vso[task.setvariable variable=imageTag;isOutput=true]$image_tag"
            name: "InitVariables"
            displayName: "Initialize Variables"
            condition: succeeded()
  - stage: deploy_to_test_rp
    dependsOn: init
    variables:
      imageTag: $[ stageDependencies.init.pipeline_variables.outputs['InitVariables.imageTag'] ]
    jobs:
      - job: build_mdnc_image
        dependsOn: []
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                tag=$(sanitize_string "$(imageTag)")
                bash src/DncRP/testdata/scripts/docker_build_and_push.sh --image dnc --tag "$tag"
            name: "BuildMDNC"
            displayName: "Build MDNC Image"
      - job: build_requestcontroller_image
        dependsOn: []
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
            condition: succeeded()
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                tag=$(sanitize_string "$(imageTag)")
                bash src/DncRP/testdata/scripts/docker_build_and_push.sh --image dnc-rc --tag "$tag"
            name: "BuildMDNCRC"
            displayName: "Build MDNC-RC Image"
            condition: succeeded()
      - job: build_rp_image
        dependsOn: []
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                tag=$(sanitize_string "$(imageTag)")
                bash src/DncRP/testdata/scripts/docker_build_and_push.sh --image dnc-rp --tag "$tag" --token "$(System.AccessToken)"
            name: "BuildMDNCRP"
            displayName: "Build DNC-RP Image"
            condition: succeeded()
      - job: build_gateway_image
        dependsOn: []
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                tag=$(sanitize_string "$(imageTag)")
                bash src/DncRP/testdata/scripts/docker_build_and_push.sh --image dnc-gateway --tag "$tag"
            name: "BuildDNCGateway"
            displayName: "Build DNC Gateway Image"
            condition: succeeded()
      - job: deploy_to_test_rp
        dependsOn:
          - build_mdnc_image
          - build_requestcontroller_image
          - build_rp_image
          - build_gateway_image
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - script: |
              set -ex
              source src/DncRP/testdata/scripts/toolbox.sh
              tag=$(sanitize_string "$(imageTag)")
              bash src/DncRP/testdata/scripts/release_to_test_rp.sh \
                --image-tag "$tag" --token "$(System.AccessToken)" \
                --output-file "./release-request.json" \
                --git-branch "$(Build.SourceBranch)"
              echo "To see the newly created release, go to this link: https://msazure.visualstudio.com/One/_release?definitionId=30730&view=mine&_a=releases"
            name: "CreateRelease"
            displayName: "Create EV2 Release"
            condition: succeeded()
          - script: |
              set -ex
              bash src/DncRP/testdata/scripts/deploy_to_test_rp.sh --token "$(System.AccessToken)" --input-file "./release-request.json"
            name: "DeployRelease"
            displayName: "Deploy EV2 Release"
            condition: succeeded()
  - stage: create_customer_cluster_1
    dependsOn: init
    variables:
      clusterResourceGroup: $[ stageDependencies.init.pipeline_variables.outputs['InitVariables.customerCluster1RG'] ]
    jobs:
      - job: create_aks_engine_cluster
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                cluster_rg=$(sanitize_string "$(clusterResourceGroup)")
                bash src/DncRP/testdata/scripts/create_customer_cluster.sh \
                  --resource-group "$cluster_rg" \
                  --location eastus2euap \
                  --datamodel src/DncRP/testdata/aks-e-datamodel.json \
                  --subscription 9b8218f9-902a-4d20-a65c-e98acec5362f
            name: "DeployAKSECluster"
            displayName: "Deploy AKS-E Cluster"
            condition: succeeded()
  - stage: create_customer_cluster_2
    dependsOn: init
    variables:
      clusterResourceGroup: $[ stageDependencies.init.pipeline_variables.outputs['InitVariables.customerCluster2RG'] ]
    jobs:
      - job: create_aks_engine_cluster
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                cluster_rg=$(sanitize_string "$(clusterResourceGroup)")
                bash src/DncRP/testdata/scripts/create_customer_cluster.sh \
                  --resource-group "$cluster_rg" \
                  --location eastus2euap \
                  --datamodel src/DncRP/testdata/aks-e-datamodel.json \
                  --subscription 9b8218f9-902a-4d20-a65c-e98acec5362f
            name: "DeployAKSECluster"
            displayName: "Deploy AKS-E Cluster"
            condition: succeeded()
  - stage: setup_customer_cluster_1
    dependsOn:
      - init
      - deploy_to_test_rp
      - create_customer_cluster_1
    variables:
      clusterResourceGroup: $[ stageDependencies.init.pipeline_variables.outputs['InitVariables.customerCluster1RG'] ]
      rpResourcesResourceGroup: $[ stageDependencies.init.pipeline_variables.outputs['InitVariables.rpResources1RG'] ]
    jobs:
      - job: create_rp_resources
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              addSpnToEnvironment: true
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                cluster_rg=$(sanitize_string "$(clusterResourceGroup)")
                rp_rg=$(sanitize_string "$(rpResourcesResourceGroup)")
                bash src/DncRP/testdata/scripts/create_rp_resources.sh \
                  --rp-resource-group "$rp_rg" \
                  --cluster-resource-group "$cluster_rg" \
                  --location "eastus2euap" \
                  --subscription "9b8218f9-902a-4d20-a65c-e98acec5362f" \
                  --service-principal "$servicePrincipalId" \
                  --password "$servicePrincipalKey" \
                  --tenant "$tenantId"
            name: "DeployRPResources"
            displayName: "Deploy RP Resources"
            condition: succeeded()
      - job: swiftify_customer_cluster
        dependsOn: create_rp_resources
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - task: AzureCLI@1
            inputs:
              addSpnToEnvironment: true
              azureSubscription: $(TEST_SUB_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              inlineScript: |
                set -ex
                source src/DncRP/testdata/scripts/toolbox.sh
                cluster_rg=$(sanitize_string "$(clusterResourceGroup)")
                rp_rg=$(sanitize_string "$(rpResourcesResourceGroup)")
                bash src/DncRP/testdata/scripts/swiftify_customer_cluster.sh \
                  --rp-resource-group "$rp_rg" \
                  --cluster-resource-group "$cluster_rg" \
                  --location "eastus2euap" \
                  --subscription "9b8218f9-902a-4d20-a65c-e98acec5362f" \
                  --service-principal "$servicePrincipalId" \
                  --password "$servicePrincipalKey" \
                  --tenant "$tenantId"
            name: "SwiftifyCustomerCluster"
            displayName: "Swiftify Customer Cluster"
            condition: succeeded()
  - stage: setup_customer_cluster_2
    dependsOn:
