pr:
  branches:
    include:
      - master

trigger:
  branches:
    include:
      - master

stages:
  - stage: build_and_test
    jobs:
      - job: unit_tests
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"


        # Go setup for the vmImage:
        # https://github.com/Microsoft/azure-pipelines-image-generation/blob/master/images/linux/scripts/installers/go.sh
        variables:
          GOPATH: "$(System.DefaultWorkingDirectory)/gopath" # Go workspace path
          GOBIN: "$(GOPATH)/bin" # Go binaries path
          modulePath: "$(GOPATH)/src/dnc" # $(build.repository.name)' # Path to the module's code

        steps:

          - checkout: self

          - bash: |
              echo "##vso[task.setvariable variable=Tag;isOutput=true]$(git describe --tags --abbrev=0 | sed 's/\./-/g')"
              echo "##vso[task.setvariable variable=Date;isOutput=true]$(date +\"%Y-%m-%d-%S\")"
              go version
              go env
              mkdir -p '$(GOBIN)'
              mkdir -p '$(GOPATH)/pkg'
              mkdir -p '$(modulePath)'
              shopt -s extglob
              shopt -s dotglob
              cp -a ./src/dnc/* '$(modulePath)/'
              echo '##vso[task.prependpath]$(GOBIN)'
              echo '##vso[task.prependpath]$(GOROOT)/bin'
              sudo apt update
              sudo apt install -y --no-install-recommends clang cmake zlib1g-dev libboost-dev libboost-thread-dev gcc gdb build-essential libssl-dev jq gcc openvswitch-switch
            name: "Env"
            displayName: "Set up the Go environment"

          - script: |
              echo Build tag is $(Env.Tag)
              go build -v ./test/nmagent/
              go build -v -o dnctl-bin ./cmd/dnctl/
              export CGO_LDFLAGS="-L $(modulePath)/pubsubproxy/libs -lMadariNativeClient -lBondDataSerializer"
              export LD_LIBRARY_PATH=$(modulePath)/pubsubproxy/libs
              go build -v
            workingDirectory: "$(modulePath)"
            name: "BuildDNC"
            displayName: "Build DNC binaries"

          - script: |
              sudo mv dnctl-bin /usr/bin/
              acn_release=$(ACN_RELEASE)
              if [[ $acn_release == latest ]]; then
                acn_release=$(curl -L -s -H 'Accept: application/json'  https://github.com/Azure/azure-container-networking/releases/latest | jq .tag_name | tr -d "\"" )
              fi
              echo Installing CNI version - $acn_release
              wget https://raw.githubusercontent.com/Azure/azure-container-networking/master/scripts/install-cni-multitenancy-plugin.sh
              chmod +x install-cni-multitenancy-plugin.sh
              sudo -E ./install-cni-multitenancy-plugin.sh $acn_release
              wget https://github.com/Azure/azure-container-networking/releases/download/$acn_release/azure-cns-linux-amd64-$acn_release.tgz
              tar -zxvf *.tgz
              echo $(jq ".WireserverIP=\"127.0.0.1:9001\"" cns_config.json) > cns_config.json
              export DNC_CONFIGURATION_PATH=$(pwd)/config_test.json
              sudo -E ./azure-cns &> azure-cns-stdout.log &
              sudo -E ./dnc &> dnc-stdout.log &
              sudo -E ./nmagent &> nmagent-mock-stdout.log & 
            workingDirectory: "$(modulePath)"
            name: "StartServices"
            displayName: "Start services"

          - script: |
              ls -lah
              pwd
              cd ./test/orchestrator
              wget -q -N https://raw.githubusercontent.com/Azure/azure-container-networking/master/scripts/docker-run.sh
              wget -q -N https://raw.githubusercontent.com/Azure/azure-container-networking/master/scripts/docker-del.sh
              chmod +x *.sh
              DNC_CONFIGURATION_PATH=../../config_test.json sudo -E go test -v
            workingDirectory: "$(modulePath)"
            name: "RunTests"
            displayName: "Run tests"

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/logs
              cp -r /var/log/azure*.log $(Build.ArtifactStagingDirectory)/logs 
            workingDirectory: "$(modulePath)"
            name: "FetchLogs"
            displayName: "Get logs from services"
            condition: always()

          - task: PublishBuildArtifacts@1
            inputs:
              artifactName: "logs"
              pathtoPublish: "$(Build.ArtifactStagingDirectory)/logs"
            displayName: "Publish test logs"
            condition: always()
